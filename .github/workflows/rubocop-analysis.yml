# pulled from repo
name: "Rubocop"

on: push

permissions:
  contents: read
  security-events: write

jobs:
  rubocop:
    runs-on: [self-hosted, Linux, ARM64, portfolio-always-on]
    timeout-minutes: 30
    strategy:
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby in the disposable Linux container
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential zlib1g-dev
        echo "GEM_HOME=$RUNNER_TEMP/gems" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/gems/bin" >> "$GITHUB_PATH"

    - name: Install Bundler
      run: gem install bundler --no-document

    # This step is not necessary if you add the gem to your Gemfile
    - name: Install Code Scanning integration
      run: bundle add code-scanning-rubocop --skip-install

    - name: Install dependencies
      run: bundle install

    - name: Rubocop run
      run: |
        bash -c "
          bundle exec rubocop --require code_scanning --format CodeScanning::SarifFormatter -o rubocop.sarif
          [[ $? -ne 2 ]]
        "

    - name: Upload Sarif output
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: rubocop.sarif
